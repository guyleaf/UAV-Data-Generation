[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "uav_data_generation"
authors = [{ name = "Leaf Ying", email = "leaf.ying.cs11@nycu.edu.tw" }]
readme = "README.md"
requires-python = ">=3.10"
version = "0.1.0"

# these will also be installed in blender env
dependencies = [
    "pillow < 11",
    "numpy < 2",
    "matplotlib < 4",
    "pycocotools",
    "rich",
    "scikit-learn < 2",
]

[project.optional-dependencies]
runtime = [
    "awscli",
    "bpy ~= 3.5.0",
    "fake-bpy-module-3.5",
    "blenderproc < 3",
    "nuscenes-devkit",
]
dev = [
    "uav_data_generation[runtime]",
    "diffusers[torch] < 5",
    "transformers < 5",
    "accelerate < 1",
    "safetensors",
    "controlnet-aux",
    "ipywidgets",
    "ipykernel",
    "invisible-watermark",
    "opencv-python < 5",
    "compel",
    "pandas",
    # "fastdup; sys_platform != 'win32'",
]

[project.scripts]
uav-gen-eval = "uav_data_generation.evaluation:cli"

[tool.hatch.build.targets.uav_data_generation]
only-include = ["uav_data_generation"]
